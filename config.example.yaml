# 复制为 config.yaml 后按需修改；未写出的项使用默认值（全部参数见 ournotes_auto/config.py，
# 或执行 ournotes-auto init-config 生成完整配置）

device:
  backend: mumu
  mumu_path: D:\MuMuPlayer   # MuMu 安装目录
  instance: 0                # MuMu 多开器里的实例编号
  touch: minitouch           # 触控：minitouch（推荐，启动失败自动改用 mumu）/ mumu（MuMu IPC）

game:
  difficulty: expert         # easy / normal / hard / expert
  note_speed: 5.0            # 游戏内「节奏图示速度」，须与 play.sync.tau_s 对应
  # 每局消耗的 LIVE BOOST：0~5（4、5 要 T.G.W CARD 10、14 级解锁，没解锁时按能选的最大值），null 为不改游戏里的设置。
  # 第一局前自动在「消耗LB」弹窗里选好；LB 不够时游戏会消耗剩余全部；用完时弹出「恢复LIVE BOOST」只点取消，之后 30 分钟内改为 0
  # （loop.until_lb_empty 为 true 时则就此结束）
  lb_cost: null
  # true：不看 lb_cost，每局按持有数选能选的最大消耗，不够就全部消耗；「全部消耗」在持有 10 个以上、
  # 或比一局局消耗能少打 2 局以上时用，用到今天的次数用完（每天几次看月卡，一般 1 次；用完了记在 data/state.json，
  # 按「切换账号」切到的账号分开记，当天不再看）
  lb_auto: false
  # true：每局前 LB 持有少于 lb_cost（为 1~5 或 lb_auto 时；0、null 时不补充）时，用道具里的 LIVE BOOST饮料补够（从「消耗LB」→「恢复」进去，
  # 只在「道具」页选，先用小型饮料；绝不用星钻、不看广告）。饮料用完或补够 lb_refill_limit 个后按上面的方式处理
  lb_refill: false
  lb_refill_limit: 0         # 本次运行最多补充多少 LB，0 为不限（直到饮料用完）
  challenge_cost: 200        # 挑战演出每局消耗的挑战pt：200 / 400 / 800 / 1600，null 为不改游戏里的设置

play:
  # 全局时间偏移（毫秒），正值整体更晚按下。每局结算后会按 FAST/SLOW 自动修正，
  # 学到的偏移另存于 data/state.json（在此基础上叠加）
  offset_ms: -16
  guard_life_zero_s: 1.0     # 演奏中生命值归零这么久（秒，整体对不上了）就暂停重试；0 为不检查
  humanize:
    enabled: false          # 自然操作：当天的操作习惯、动作时长、菜单停留、休息；不以 AP 为目标时 GREAT 关着也打 1%~5%、时机偏移至少 8ms
    rest_every_plays: 8      # 平均完成这么多局后短休息（每轮在 60%~140% 间随机）；0 关闭
    rest_min_s: 30
    rest_max_s: 90           # 短休息范围（秒）；等 LB 等长时间空闲后不重复休息
    rare_rest_chance: 0.12   # 短休息偶尔特别久（rest_max_s 的 2~6 倍）的概率
    long_rest_minutes: 75    # 累计演奏约这么多分钟（每轮在 80%~120% 间随机）后长休息；0 关闭
    long_rest_min_s: 600
    long_rest_max_s: 1800    # 长休息范围（秒）
  touch:
    jitter_ms: 0            # 时机漂移幅度，0 关闭；可设 8 / 16，上限 20
    position_jitter: 0      # 触点位置变化，0 关闭、1 最大
    great_ratio: 0          # 故意打 GREAT 的比例，0 关闭；AP 补完 / 优先没 AP 时忽略
    great_ratio_max: 0      # 比 great_ratio 大时每局在两者之间随机取比例（如 0.01 ~ 0.05）；0 为固定
  sync:
    tau_s: 0.835             # 流速 5.00 实测值；改了流速用 calibrate motion 重新测量

autotune:
  enabled: true
  step_ms: 1.0               # 结果全 FAST 或全 SLOW 时的单次修正量

loop:
  song_mode: current         # current：一直打当前曲目；random：每局后随机选曲；ap：全曲 AP 补完；
                             # ap_first：当前难度优先打没 AP 的歌，没有了再随机（挑战演出时轮流打）；list：按歌单依次打；
                             # rotate：挑战演出的几首歌轮流打（挑战演出只能用 current / rotate / ap_first）
  song_list: ""              # 歌单：曲目 ID 或曲名，逗号分隔，可加 @难度，如 "100010, 碧天伴走@hard"
  max_plays: 0               # 0 为不限
  challenge: false           # true：打挑战演出（部分活动期间开放，消耗挑战pt），打到 CP 不够一局为止
  arena: false               # true：打激奏舞台（多人对局，转盘定歌，只打 EXPERT），LB 消耗按 game.lb_cost / lb_auto
  arena_band: current        # 激奏舞台的乐队：current 不换；mygo / avemujica / mewtype / millsage / dumbrock；
                             # rotate：从当前乐队开始按游戏里的顺序每队打 arena_games_per_band 局再换下一队
  arena_games_per_band: 1
  until_lb_empty: false      # true：打到 LB 用完为止（清体力，需要 game.lb_cost 为 1~5 或 game.lb_auto）
  wait_lb: false             # true：挂机，LB 用完后停在乐队确认页等它恢复到 game.lb_cost 个再接着打，一直运行
                             # （game.lb_cost 为 0 时不等：持有 LB 时每局消耗 1 个，用完了消耗 0 接着打；
                             # game.lb_auto 时每恢复 1 个就消耗）
  use_skip: false            # true：自由演出先用乐队确认页的「跳过」消耗 LB（每天有次数），次数用完了再演奏
  studio_claim_hours: 0      # 每隔这么多小时回主界面领一次录音室练习（收获），开始时先领一次；0 为不领（最多累计 12 小时）
  daily_claim_time: ""       # 每天到这个时间（电脑的本地时间，要加引号，如 "22:30"）回主界面领一次任务、礼物盒等日常；
                             # 留空不领。游戏每天 3:00 日期变更，挂机跨天时用
  max_failures: 5            # 连续失败这么多次后停止
  sync_retries: 2            # 首音符同步失败、演奏中生命值归零时暂停、点「重试」从头再来的次数（每局），用完了等歌曲放完；0 为不重试
  min_fps: 50                # 连续打歌时最近 5 次同步测到的游戏出帧率（中位数）低于它就重启游戏（连续运行十几个小时后会越来越卡）；0 为不检查
  daily_hours: 0             # 每个游戏日（3:00 换日）最多演奏几小时（每局从选歌到结算累计，休息、等 LB 不算）；到了就结束，挂机等到下一个游戏日；0 为不限
  ap_difficulties: expert,hard,normal,easy  # AP 补完依次处理的难度
  ap_first_difficulties: ""  # ap_first 依次补的难度（如 expert,hard,normal,easy），都补完了按 game.difficulty 随机；留空只补 game.difficulty
  ap_max_attempts: 3         # AP 补完 / ap_first 时同一首歌最多打几次
  ap_done_hours: 12          # ap_first 确认过某难度没有要补的歌后，这么多小时内跳过它的检查（有新曲、切换账号时照样检查）；0 为每次都检查

notify:                      # 推送到手机：打歌、领取日常完成，任务出错结束，挂机遇到服务器维护时发一条消息（手动停止的不推送）
  channel: ""                # 留空不推送；ntfy（免费，手机装 ntfy 应用订阅主题）/ serverchan（Server酱，推到微信）/ bark（Bark，推到 iPhone）/ webhook
  target: ""                 # ntfy 的主题名（自建服务填完整网址）、Server酱的 SendKey、Bark App 里复制的网址（或只填 key）或 webhook 的网址。等于密码，别发给别人
  events: done,error,maintenance   # 推送哪些：done 完成、error 出错、maintenance 服务器维护；设好后用 ournotes-auto notify-test 试一下
